<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header>
        <h1>Tic Tac Toe</h1>
    </header>

    <main>
        <section class="game">

    <div class="players">
        <input type="text" id="player-one" placeholder="Player 1 name">
        <input type="text" id="player-two" placeholder="Player 2 name">
        <button id="start-button">Start / Restart</button>
    </div>

    <h2 id="game-status">Enter names and start playing!</h2>

    <div id="gameboard" class="gameboard"></div>

</section>
    </main>

</body>
</html>
